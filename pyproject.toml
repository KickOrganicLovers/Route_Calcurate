[project]
name = "route-calculate"
version = "0.2.0"
description = "補給地点選定 + 配分ルート最適化シミュレーション(GUI / CLI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "ortools>=9.15.6755",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# デスクトップアプリ(専用ウィンドウ)で起動する場合
desktop = ["pywebview>=5.3"]

[project.scripts]
depot-planner = "depot_planner.cli:main"
depot-planner-app = "depot_planner.desktop:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# 配布用の exe / .app を作る(packaging/README.md)
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "depot_planner"
