[project]
name = "route-calculate"
version = "0.2.0"
description = "補給地点選定 + 配分ルート最適化シミュレーション(GUI / CLI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "ortools>=9.15.6755",
    "python-docx>=1.1",
]

[project.scripts]
depot-planner = "depot_planner.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "depot_planner"
